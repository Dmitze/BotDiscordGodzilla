# Docker Compose конфігурація для Discord AI Assistant Bot
# Оновлено: 28.07.2025

version: '3.8'

services:
  # Основний бот
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: discord-ai-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - LOG_LEVEL=info
    ports:
      - '9090:9090' # Метрики Prometheus
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./google-credentials.json:/app/google-credentials.json:ro
    depends_on:
      - redis
      - ollama
    networks:
      - bot-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9090/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis для кешування
  redis:
    image: redis:7-alpine
    container_name: discord-bot-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - bot-network
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama для локального AI
  ollama:
    image: ollama/ollama:latest
    container_name: discord-bot-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - bot-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: discord-bot-prometheus
    restart: unless-stopped
    ports:
      - '9091:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - bot-network
    depends_on:
      - discord-bot

  # Grafana для візуалізації
  grafana:
    image: grafana/grafana:latest
    container_name: discord-bot-grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - bot-network
    depends_on:
      - prometheus

  # Nginx для проксування (опціонально)
  nginx:
    image: nginx:alpine
    container_name: discord-bot-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - bot-network
    depends_on:
      - discord-bot
      - grafana
    profiles:
      - production

  # Backup сервіс
  backup:
    image: alpine:latest
    container_name: discord-bot-backup
    restart: 'no'
    volumes:
      - ./backups:/backups
      - redis-data:/data/redis:ro
      - ollama-data:/data/ollama:ro
    environment:
      - BACKUP_RETENTION_DAYS=7
    command: |
      sh -c "
        echo 'Creating backup...' &&
        tar -czf /backups/backup-$$(date +%Y%m%d-%H%M%S).tar.gz /data &&
        find /backups -name 'backup-*.tar.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete &&
        echo 'Backup completed'
      "
    networks:
      - bot-network
    profiles:
      - maintenance

volumes:
  redis-data:
    driver: local
  ollama-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  bot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
