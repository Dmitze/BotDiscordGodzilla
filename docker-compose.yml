version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: src/config/docker/Dockerfile
    container_name: discord-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - postgres
    networks:
      - discord-bot-network
    volumes:
      - ./data:/usr/src/app/data
      - ./workspace:/usr/src/app/workspace
    healthcheck:
      test: ["CMD", "node", "src/config/docker/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  n8n:
    image: n8n/n8n:latest
    container_name: discord-bot-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./n8n-workflows:/workflows
    depends_on:
      - postgres
    networks:
      - discord-bot-network

  postgres:
    image: postgres:15
    container_name: discord-bot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - discord-bot-network

  redis:
    image: redis:7-alpine
    container_name: discord-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - discord-bot-network

networks:
  discord-bot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: