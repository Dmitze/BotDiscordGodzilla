<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вся документація - Godzilla Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #5865F2;
            --background: #1e1e2d;
            --surface: #2b2b40;
            --text: #e6e6e6;
            --text-secondary: #a1a1aa;
            --accent: #7289da;
            --success: #43b581;
            --warning: #faa61a;
            --error: #f04747;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: linear-gradient(135deg, var(--background) 0%, #121212 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent);
            transform: translateX(-5px);
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .category-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(88, 101, 242, 0.1);
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(88, 101, 242, 0.3);
        }
        
        .category-card h3 {
            color: var(--primary);
            margin-bottom: 0.8rem;
            font-size: 1.3rem;
        }
        
        .category-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .category-card .count {
            display: inline-block;
            background: rgba(88, 101, 242, 0.2);
            color: var(--primary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .docs-list {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .docs-list h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
        }
        
        .doc-item {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .doc-item:last-child {
            border-bottom: none;
        }
        
        .doc-item:hover {
            background: rgba(88, 101, 242, 0.1);
            border-radius: 8px;
        }
        
        .doc-item a {
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .doc-item a:hover {
            color: var(--primary);
        }
        
        .doc-item i {
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 2rem;
            border-top: 1px solid var(--surface);
        }
        
        /* Floating elements */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .floating-element {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-element:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .floating-element:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 40%;
            right: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .categories {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-book"></i> Вся документація</h1>
            <p>Повний список усіх документів Discord AI Assistant Bot</p>
        </header>
        
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Повернутися до головної
        </a>
        
        <div class="docs-list">
            <h2><i class="fas fa-folder-open"></i> Усі документи</h2>
            <div id="docsContainer">
                <!-- Documents will be loaded here -->
            </div>
        </div>
        
        <footer>
            <p>© 2025 Godzilla Bot | Створено Дмитром Шивачовим (Dmitze)</p>
            <p>Ліцензія MIT | Версія: v3.0.0</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('manifest.json')
                .then(response => response.json())
                .then(manifest => {
                    const container = document.getElementById('docsContainer');
                    
                    // Group documents by category
                    const categories = {};
                    manifest.forEach(doc => {
                        if (!categories[doc.category]) {
                            categories[doc.category] = [];
                        }
                        categories[doc.category].push(doc);
                    });
                    
                    // Display documents
                    let html = '';
                    for (const category in categories) {
                        html += `<h3 style="color: var(--accent); margin: 1.5rem 0 1rem;">${category.toUpperCase()}</h3>`;
                        categories[category].forEach(doc => {
                            html += `
                                <div class="doc-item">
                                    <a href="${doc.url}">
                                        <i class="fas fa-file-alt"></i>
                                        <span>${doc.title}</span>
                                    </a>
                                </div>
                            `;
                        });
                    }
                    
                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading manifest:', error);
                    document.getElementById('docsContainer').innerHTML = '<p>Помилка завантаження документації</p>';
                });
        });
    </script>
</body>
</html>
